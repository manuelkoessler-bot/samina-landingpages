            @keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}

            @keyframes spin{to{transform:rotate(360deg)}}
            .wrap{position:fixed;left:0;top:0;bottom:0;width:min(560px,100%);display:flex;align-items:center;padding:0 55px;box-sizing:border-box}
            .card{width:100%;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
            @keyframes rise{from{opacity:0;transform:translateY(21px)}to{opacity:1;transform:none}}
            .lab{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--sprout);margin:0 0 13px}
            h1{font-family:Georgia,"Times New Roman",serif;font-weight:300;line-height:1.02;font-size:clamp(42px,6vw,68px);margin:0 0 13px}
            .sub{font-weight:300;font-size:18px;line-height:1.5;margin:0 0 34px;opacity:.95}
            .field{margin:0 0 13px}
            #staticrypt-password{width:100%;box-sizing:border-box;border:0;border-radius:4px;padding:17px 21px;font:400 17px "Open Sans",sans-serif;letter-spacing:.06em;color:var(--deep);background:#fff;outline:0}
            #staticrypt-password::placeholder{color:#7d8a82}
            .btn{width:100%;border:1.5px solid #fff;border-radius:4px;padding:16px;font:600 14px "Open Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:transparent;cursor:pointer;transition:background .2s,color .2s}
            .btn:hover{background:#fff;color:var(--room)}
            .remember{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:300;margin:8px 0 21px;cursor:pointer}
            .remember input{width:18px;height:18px;accent-color:#fff}
            .err{min-height:24px;font-size:15px;margin:13px 0 0;opacity:0;transition:opacity .3s}
            .err.on{opacity:1}
            .shake{animation:shake .45s}
            @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
            .claim{position:fixed;left:55px;bottom:34px;font-family:Georgia,serif;font-size:17px;opacity:.9}
            .lockup{position:fixed;right:34px;bottom:34px;width:30px}
            .lockup svg{width:100%;height:auto;display:block}
            body.ok .card{transition:opacity .8s;opacity:0}
            @media (max-width:700px){.fade{width:100%;background:rgba(14,122,63,.82)}.wrap{width:100%;padding:0 21px}.lockup{display:none}.claim{left:21px}}
            @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
